      title: Woman charged with DUI in March crash that killed man in Austin
      site: Chicago Sun-Times
      date: '2020-11-13T08:24:29Z'
      description: |
        Lisa Torres-Binder, charged with aggravated DUI causing death, allegedly had heroin, codeine, fentanyl, morphine, norfentanyl and sertraline in her system, prosecutors said. Jose Felix Sanchez Leon, 44, had been delivering food and was changing a flat tire when he was struck; Torres-Binder continued driving and struck five more vehicles before coming to a stop, prosecutors said.
