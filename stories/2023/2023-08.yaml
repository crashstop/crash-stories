      date: '2024-02-25T11:00:08+00:00'
      description: Serious or fatal traffic crashes with pedestrians or cyclists in Chicago, like the one involving Nakari Campbell, often fail to lead to charges or citations, a Tribune analysis of Chicago police data shows. Of more than 4,000 such crashes between 2018 and mid-November 2023 reviewed by the Tribune, traffic tickets or more serious violations were listed in about 26% of cases.
