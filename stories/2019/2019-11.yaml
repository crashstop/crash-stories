      title: A 'Lack Of Hope' Permeates Chicago's Cyclist Community After Another Fatal Bike Crash On Stony Island
      site: Block Club Chicago
      date: '2019-11-19T13:35:13+00:00'
      description: |
        Lee Luellen, 40, became the second cyclist killed this on a stretch of road where aldermen rejected bike lanes in the past. Sabrinia Williams, 42, faces two misdemeanor counts of driving on a suspended license and operating a vehicle while uninsured causing bodily harm. She was also cited for failure to reduce speed.

    - url: https://chi.streetsblog.org/2019/11/19/driver-who-killed-cyclist-lee-luellen-40-charged-cdp-retracts-victim-blaming-statement
      title: Driver who killed cyclist Lee Luellen charged, CDP retracts victim-blaming statement
      site: Chicago Streetsblog
      date: '2019-11-19T19:13:58+00:00'
      description: |
        Police initially implied that Luellen might have been responsible for his own death, stating that he “may have been in the middle of the street when he was hit.” The Chicago Police Department has since walked back that statement, acknowledging that the cyclist’s lane position had nothing to do with the motorist killing him.

