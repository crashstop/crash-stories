    - url: https://www.chicagotribune.com/2019/09/23/editorial-liz-boshardy-pregnant-and-killed-by-a-truck-at-29-lived-her-poignant-lesson-try-to-experience-as-much-of-life-as-possible/
      title: 'Editorial: Liz Boshardy, pregnant and killed by a truck at 29, lived her poignant lesson: ‘Try to experience as much of life as possible’'
      site: Chicago Tribune
      date: '2019-09-23T15:30:01+00:00'
      description: |
        Liz Boshardy packed a lot of life into her 29 years. She was a ballet dancer, then a data scientist. She married her high school sweetheart. She visited Nepal and the Galapagos Islands. She went dog-sledding in Norway and whale-watching in Hawaii.

