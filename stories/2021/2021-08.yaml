    - url: https://abc7chicago.com/post/wrigleyville-hit-and-run-crash-sophie-allen/10962604/
      title: Wrigleyville hit-and-run survivor recalls crash that killed best friend, begs driver to come forward
      site: ABC 7 Chicago
      date: '2021-08-19T22:52:00Z'
      description: '"Part of me is like, what was the last thing that I said to my best friend?" Nahiomy Alvarez said. "I do not think that I will ever remember and that breaks my heart."'

    - url: https://www.dignitymemorial.com/obituaries/cary-nc/sophie-allen-10315492
      title: Sophie Allen Obituary - Cary, NC
      site: dignitymemorial.com
      date: 2021-08-23
      description: 'Sophie has always been an incredible person: joyful, dynamic, smart, accomplished, outrageously ambitious, and caring just begin to describe her. She was fiercely passionate about everything: friends, family, puppy dogs, soccer, Duke, travel, food, reading, spin cycling, surfing... the list goes on and on. Sophie never met a stranger, and she fully lived every single second of her amazing life with unbelievable energy and joy. She was a natural leader and always left everything on the field.'

    - url: https://blockclubchicago.org/2021/12/14/man-who-killed-woman-in-wrigleyville-hit-and-run-fled-another-crash-seconds-before-striking-her-prosecutors-say/
      title: Man Who Killed Woman In Wrigleyville Hit-And-Run Fled Another Crash Seconds Before Striking Her, Prosecutors Say
      site: Block Club Chicago
      date: '2021-12-14T19:50:00+00:00'
      description: Brett Dimick, of Old Town, faces three felony charges, including reckless homicide and failing to report an accident resulting in death and injury in the Aug. 14 crash. Police and prosecutors said he was driving a gold BMW X3 and ran a stop sign at Addison and Fremont streets, drove up onto the sidewalk of Fremont and hit friends Sophie Allen and Nahiomy Alvarez. Allen, 27, died, and Alvarez was badly injured.

    - url: https://chi.streetsblog.org/2023/01/05/9-years-for-sophie-allens-killer-is-a-rare-example-of-serious-consequences-for-a-hit-and-run
      title: 9 years for Sophie Allen's killer is a rare example of consequences for a hit-and-run
      site: Chicago Streetsblog
      date: '2023-01-05T07:25:21+00:00'
      description: Under Illinois law, driver Brett Dimick will probably be required to serve half of his sentence. More actual jail time would send a much stronger message that drivers who kill people and flee will be held accountable.

