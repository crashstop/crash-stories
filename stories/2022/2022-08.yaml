      description: Shawman was brilliant, beautiful and athletic; she loved life and was always on the go. She enjoyed travel, music, camping, the outdoors and crafting. Shawman was the queen of color, fun and candy. She was the ultimate gift giver, memory keeper, cheerleader, daughter, sister, aunt, partner and friend. Her radiant smile and fun-loving ways will not be forgotten. Her heart was open, generous and had the ability to connect to many.

